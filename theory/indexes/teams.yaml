# The formalization behind this repository's evaluation card.
#
# Every theorem here is PROVED -- there is no `sorry` in the Lean file this
# indexes, and it typechecks against Mathlib.
#
# The statements are small on purpose, and the content is in the HYPOTHESES
# rather than the conclusions: each is a modest true claim whose premises are
# the things the card does not check. That is what the formalization is for.
# The card's own assertion is an empirical matter and is not a theorem.

schema_version: 1
formalization:
  system: lean4
entries:
- id: AIQ.Teams.CircuitOverlap.jaccard_le_one
  kind: theorem
  declaration: AIQ.Teams.CircuitOverlap.jaccard_le_one
  source_path: theory/lean/CircuitOverlap.lean
  statement: 'Circuit overlap is bounded by one, for any two circuits including empty ones.
    PROVED. Together with jaccard_comm and jaccard_self this is the whole of what is established
    about the overlap; whether it is a property of the FUNCTION rather than the parameterization
    is open and is stated in AIQ.Conjectures.Circuits.

    '
- id: AIQ.Teams.CircuitOverlap.jaccard_self
  kind: theorem
  declaration: AIQ.Teams.CircuitOverlap.jaccard_self
  source_path: theory/lean/CircuitOverlap.lean
  statement: 'A nonempty circuit overlaps itself completely. PROVED.

    '
  premises:
  - id: hA
    type: 'hA : A.Nonempty'
    statement: the circuit is nonempty, which top_k with k > 0 guarantees
